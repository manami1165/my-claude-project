<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TODOアプリ</h1>

    <!-- 新しいTODOを追加するフォーム -->
    <form id="todo-form">
      <input type="text" id="todo-title" placeholder="やることを入力" required>
      <button type="submit">追加</button>
    </form>

    <!-- APIエラー発生時にメッセージを表示する領域 -->
    <p id="error-message" class="error-message" hidden></p>

    <!-- TODO一覧を表示するリスト -->
    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
