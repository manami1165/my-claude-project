# 品質のチェックを自動化

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    #　環境を整える
      - name: コードをチェックアウト
        uses: actions/checkout@v4
    #　必要なライブラリを入れる
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      #　書き方のミスを自動でチェックしてくれる
      - name: Lint
        run: npm run lint --if-present

      - name: テストを実行 (カバレッジ計測付き)
        run: npm run test:ci

      - name: カバレッジレポートをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
